services:
  # ═══════════════════════════════════════
  # Web UI (czat w przeglądarce, jak ChatGPT)
  # ═══════════════════════════════════════
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    volumes:
      - ./webui_data:/app/backend/data
      - ./server:/app/backend/data/docs/server:ro
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODELS=llama3.1:8b
      # Web search
      - ENABLE_RAG_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
    depends_on:
      - ollama
      - searxng
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.open-webui.rule=Host(`open-webui.localhost`)
      - traefik.http.routers.open-webui.entrypoints=web
      - traefik.http.services.open-webui.loadbalancer.server.port=8080
      - traefik.docker.network=traefik
    networks:
      - traefik
