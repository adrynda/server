services:
  # ═══════════════════════════════════════
  # Agent CLI (jak Claude Code)
  # ═══════════════════════════════════════
  aider:
    user: "${UID}:${GID}"
    image: paulgauthier/aider-full
    container_name: aider
    profiles:
      - cli
    volumes:
      - ./server:/workspace:rw
      - ./aider_config:/root/.aider:rw
    working_dir: /workspace
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
    depends_on:
      - ollama
    stdin_open: true
    tty: true
    command: >
      --model ollama_chat/qwen2.5-coder:7b
      --no-auto-commits
      --no-git
      --map-tokens 2048
      --edit-format diff
