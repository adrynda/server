services:
  # ═══════════════════════════════════════
  # Agent CLI (jak Claude Code)
  # ═══════════════════════════════════════
  aider:
    user: "${UID-1000}:${GID-1000}"
    image: paulgauthier/aider-full
    container_name: aider
    profiles:
      - cli
    volumes:
      - ../../../..:/workspace:rw
      - ./aider_config:/root/.aider:rw
    working_dir: /workspace
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
    depends_on:
      - ollama
    stdin_open: true
    tty: true
    networks:
      - traefik
    command: >
      --model ollama_chat/qwen2.5-coder:7b
      --no-auto-commits
      --no-git
      --map-tokens 2048
      --edit-format diff
      --aiderignore /workspace/.aiderignore

  # Wariant z repo-mapą: do użycia gdy pracujesz w obrębie jednego projektu
  # (każdy projekt ma własne, realne repo gita, więc repo-map ma z czego skorzystać).
  # Uruchamiać z nadpisanym --workdir na katalog projektu, patrz: make aider-project-<nazwa>
  aider-project:
    user: "${UID-1000}:${GID-1000}"
    image: paulgauthier/aider-full
    container_name: aider-project
    profiles:
      - cli
    volumes:
      - ../../../..:/workspace:rw
      - ./aider_config:/root/.aider:rw
    working_dir: /workspace
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
    depends_on:
      - ollama
    stdin_open: true
    tty: true
    networks:
      - traefik
    command: >
      --model ollama_chat/qwen2.5-coder:7b
      --no-auto-commits
      --map-tokens 2048
      --edit-format diff
      --aiderignore /workspace/.aiderignore
