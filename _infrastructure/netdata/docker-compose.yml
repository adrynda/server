services:
  netdata:
    image: netdata/netdata
    container_name: netdata
    pid: host
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netdata.rule=Host(`netdata.localhost`)"
      - "traefik.http.routers.netdata.entrypoints=web"
      - "traefik.http.routers.netdata.middlewares=netdata-auth"
      - "traefik.http.middlewares.netdata-auth.basicauth.users=admin:$$2y$$05$$CNGZ3x5LIbcmPnoQoSMKfOmgNbPwgSvtHgkIJyIihp7rgTXjzoJS."
      # Netdata działa w network_mode: host, więc nie jest podpięty do żadnej
      # sieci Dockera - Traefik nie może go znaleźć przez zwykłe auto-discovery
      # po porcie. Dlatego wskazujemy mu bezpośrednio adres URL hosta:
      - "traefik.http.services.netdata.loadbalancer.server.url=http://host.docker.internal:19999"
      #
      # PIERWOTNA WERSJA (dla kontenera BEZ network_mode: host, podpiętego
      # do sieci "server") - gdybyś chciał wrócić do tamtego podejścia,
      # zakomentuj linijkę z .url powyżej i odkomentuj te dwie:
      # - "traefik.http.services.netdata.loadbalancer.server.port=19999"
      # - "traefik.docker.network=server"

    # Netdata jest w trybie host, więc NIE podpinamy go do sieci "server"
    # (nie da się łączyć network_mode: host z networks: jednocześnie).
    # PIERWOTNA WERSJA - odkomentuj poniższe, jeśli zrezygnujesz z
    # network_mode: host (patrz uwaga powyżej):
    # networks:
    #   - server

  # Na WSL2 (Docker Desktop) host.docker.internal zwykle działa od razu.
  # Jeśli Traefik nie może się połączyć (błąd "no such host" / connection
  # refused), dodaj poniższy blok do SERWISU TRAEFIKA w jego compose:
  #
  # traefik:
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

volumes:
  netdataconfig:
  netdatalib:
  netdatacache: